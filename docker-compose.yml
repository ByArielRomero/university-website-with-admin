version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: university-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=mysql://admin:password@db:3306/university
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=changeme_in_production
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: university-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: university
      MYSQL_USER: admin
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
