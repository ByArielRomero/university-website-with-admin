services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: university-web
    restart: always
    ports:
      - "3001:3000"
    environment:
      - DATABASE_URL=mysql://admin:password@db:3306/university
      - NEXTAUTH_URL=https://centrouniversitarioexaltacion.com
      - NEXTAUTH_SECRET=changeme_in_production
      - NEXT_PUBLIC_GA_ID=G-YCCJXKL9NT
    depends_on:
      - db
    volumes:
      # Bind mount: archivos en /var/www/uploads del host,
      # accesibles por Nginx Y por el contenedor Next.js
      - /var/www/uploads:/app/public/uploads

  db:
    image: mysql:8.0
    container_name: university-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: university
      MYSQL_USER: admin
      MYSQL_PASSWORD: password
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
